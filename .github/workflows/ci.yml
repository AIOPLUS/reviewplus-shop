name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      SITE_URL: ${{ vars.SITE_URL || 'https://shop.reviewplus.io' }}
      SHOP_BASE_PATH: ${{ vars.SHOP_BASE_PATH || '/' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Linkcheck
        run: npm run linkcheck
      - name: Build fase 2 (/shop) als controle
        run: npm run build && npm run linkcheck
        env:
          SITE_URL: https://www.reviewplus.io
          SHOP_BASE_PATH: /shop
      - name: Build fase 1 opnieuw voor Lighthouse
        run: npm run build
      - name: Lighthouse CI (mobiel, drempel 95)
        run: npx lhci autorun
      - name: Lighthouse-rapporten bewaren
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse
          path: .lighthouseci/
